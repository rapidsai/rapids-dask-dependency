schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  date_string: '${{ env.get("RAPIDS_DATE_STRING") }}'
  head_rev: '${{ git.head_rev(".")[:8] }}'

package:
  name: rapids-dask-dependency
  version: ${{ version }}

source:
  path: ../../..

build:
  noarch: python
  string: ${{ date_string }}_${{ head_rev }}
  script:
    content: |
      python -m pip install . -vv --no-deps

requirements:
  host:
    - pip
    - setuptools>=77.0.0
  run:
    # >=,< form is preferred here to allow for post-releases to fix packaging problems (e.g. 2026.1.1.post1)
    # or targeted releases to fix security issues (like 2026.1.1.1)
    - dask >=2026.1.1,<2026.1.2
    - dask-core >=2026.1.1,<2026.1.2
    - distributed >=2026.1.1,<2026.1.2

tests:
  - script:
      - python -m pytest -v tests/
    files:
      source:
        - tests/*
    requirements:
      run:
        - pytest

about:
  homepage: https://github.com/rapidsai/rapids-dask-dependency
  license: ${{ load_from_file("pyproject.toml").project.license }}
  summary: ${{ load_from_file("pyproject.toml").project.description }}
